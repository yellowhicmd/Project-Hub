<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5ff">
  <meta name="description" content="Explore one of my projects.">
  <title>Project | My Digital Space</title>
  <link rel="stylesheet" href="../style.css">
  <script src="../app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../" aria-label="Back to home">
      <span class="brand-mark">✳</span>
      <span id="brand-name">My Digital Space</span>
    </a>

    <div class="top-actions">
      <a class="icon-button github-link"
        href="https://github.com"
        target="_blank" rel="noopener"
        aria-label="GitHub" title="GitHub">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor"
            d="M12 .9a11.1 11.1 0 0 0-3.51 21.63c.56.1.76-.24.76-.54v-2.08c-3.1.67-3.76-1.31-3.76-1.31-.51-1.3-1.25-1.65-1.25-1.65-1.02-.7.08-.69.08-.69 1.13.08 1.73 1.16 1.73 1.16 1 .1.66 2.06 3.26 1.49.1-.73.39-1.22.7-1.5-2.48-.28-5.09-1.24-5.09-5.52 0-1.22.44-2.21 1.16-2.99-.12-.28-.5-1.42.11-2.95 0 0 .94-.3 3.05 1.14a10.6 10.6 0 0 1 5.55 0c2.11-1.44 3.04-1.14 3.04-1.14.61 1.53.23 2.67.12 2.95.72.78 1.15 1.77 1.15 2.99 0 4.29-2.61 5.23-5.1 5.51.4.35.75 1.02.75 2.06v3.05c0 .3.2.65.77.54A11.1 11.1 0 0 0 12 .9Z"/>
        </svg>
      </a>

      <button class="icon-button" id="theme-toggle"
        type="button" aria-label="Switch color theme"
        title="Switch theme">
        <svg class="theme-icon" viewBox="0 0 24 24"
          aria-hidden="true">
          <path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.64 5.64l1.42 1.42m9.88 9.88 1.42 1.42m0-12.72-1.42 1.42m-9.88 9.88-1.42 1.42M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10Z"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="project-shell">
    <a class="back-link reveal" href="../">
      <span aria-hidden="true">←</span> All projects
    </a>

    <section class="project-hero reveal">
      <div class="project-icon-frame" id="project-icon-frame">
        <span id="project-fallback-icon">✳</span>
      </div>

      <div class="project-category" id="project-category">
        WEB PROJECT
      </div>

      <h1 id="project-title">Loading project...</h1>
      <p class="project-description" id="project-description">
        Just a moment...
      </p>

      <div class="project-actions">
        <a id="visit-project" class="primary-button"
          href="../" target="_blank" rel="noopener">
          Visit website <span aria-hidden="true">↗</span>
        </a>
        <a class="secondary-button" href="../">
          Explore more
        </a>
      </div>
    </section>

    <section class="star-card reveal" id="star-card" hidden>
      <div class="star-icon-wrap" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9L12 3Z"/>
        </svg>
      </div>

      <div class="star-copy">
        <h2>Enjoying my projects?</h2>
        <p id="star-message">
          If you like my projects, consider starring my repo.
        </p>
      </div>

      <a id="star-link" class="star-button"
        href="https://github.com"
        target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9L12 3Z"/>
        </svg>
        Star on GitHub
      </a>
    </section>

    <section class="project-footer reveal">
      <span>Part of <strong id="project-owner">My Digital Space</strong></span>
      <a href="../">Back to the hub ↗</a>
    </section>
  </main>

  <footer class="footer">
    <span>© <span id="current-year"></span>
      <span id="footer-owner">Made with curiosity</span>
    </span>
    <span>One hub, many ideas <span class="footer-heart">♥</span></span>
  </footer>

  <noscript>
    <p>This project page requires JavaScript to load project information.</p>
  </noscript>
</body>
</html>
